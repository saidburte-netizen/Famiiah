name: CD

# Continuous deployment. Runs manually (choose the environment) or on a
# version tag. Database migrations are forward-only and run before functions,
# admin and mobile so the backend is never ahead of the clients.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      components:
        description: components to deploy — all | db,functions,admin,mobile
        type: string
        default: all
  push:
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  db:
    name: Deploy database
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.components == 'all' ||
      contains(github.event.inputs.components, 'db')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project and push migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  functions:
    name: Deploy Edge Functions
    needs: [db]
    if: >-
      always() && (needs.db.result == 'success' || needs.db.result == 'skipped') &&
      (github.event_name == 'push' ||
       github.event.inputs.components == 'all' ||
       contains(github.event.inputs.components, 'functions'))
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  admin:
    name: Deploy admin (Vercel)
    needs: [db]
    if: >-
      always() && (needs.db.result == 'success' || needs.db.result == 'skipped') &&
      (github.event_name == 'push' ||
       github.event.inputs.components == 'all' ||
       contains(github.event.inputs.components, 'admin'))
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        working-directory: apps/admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: npx vercel build --prod --token="$VERCEL_TOKEN"
        working-directory: apps/admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        working-directory: apps/admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  mobile:
    name: Build & submit mobile (EAS)
    needs: [db]
    if: >-
      always() && (needs.db.result == 'success' || needs.db.result == 'skipped') &&
      (github.event_name == 'push' ||
       github.event.inputs.components == 'all' ||
       contains(github.event.inputs.components, 'mobile'))
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global eas-cli
      # When the Android upload keystore is provided as secrets, write it and a
      # credentials.json locally and build with the `ci` profile
      # (credentialsSource: local). Otherwise build with EAS-managed credentials.
      - name: Prepare Android credentials
        id: creds
        working-directory: apps/mobile
        env:
          # Accept either naming so the build works whichever set was stored.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            node scripts/write-android-credentials.mjs
            echo "profile=ci" >> "$GITHUB_OUTPUT"
            echo "platform=android" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64; using EAS-managed credentials."
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "platform=all" >> "$GITHUB_OUTPUT"
          fi
      - name: EAS build
        run: eas build --platform "${{ steps.creds.outputs.platform }}" --profile "${{ steps.creds.outputs.profile }}" --non-interactive --no-wait
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: [db, functions, admin, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
