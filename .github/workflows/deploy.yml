name: CD

# Continuous deployment. Trigger it by hand from the Actions tab (choose what to
# deploy) or by pushing a version tag.
#
# Deploys: database migrations, edge functions, and — opt-in — the Expo mobile
# app (Android/Play). The admin web app is intentionally NOT deployed here; host
# it separately if you need it (CI still typechecks and builds apps/admin).
#
# Triggering this is enough to deploy the backend on the free stack: it needs
# only SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_URL, which are
# already configured. The project ref is derived from SUPABASE_URL, so you do
# not have to add a SUPABASE_PROJECT_ID secret (if you do add one, it wins).
# EXPO_TOKEN is only needed by the opt-in `mobile` component.

on:
  workflow_dispatch:
    inputs:
      components:
        description: >-
          Components to deploy. Use "db,functions" for the backend (the usual
          choice), "all" to also build the Expo mobile app with EAS, or one of
          "db" / "functions" / "mobile".
        type: string
        default: db,functions
      baseline:
        description: >-
          Migration-history baseline. "auto" (recommended) marks migrations
          0001-0019 as already applied when the remote history is empty, so only
          0020 runs. "never" just pushes. "always" forces the baseline.
        type: choice
        options: [auto, never, always]
        default: auto
      environment:
        description: Informational label only (no approval gate is configured)
        type: string
        default: production
  push:
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  db:
    name: Deploy database
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.components == 'all' ||
      contains(github.event.inputs.components, 'db')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          # Pinned: resolving `latest` hits the GitHub API and fails the job with
          # "rate limit exceeded". v3 installs the CLI from npm.
          version: 2.121.0
      - name: Resolve project ref
        id: project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -e
          ref="$SUPABASE_PROJECT_ID"
          if [ -z "$ref" ]; then
            : "${SUPABASE_URL:?Set SUPABASE_URL (or SUPABASE_PROJECT_ID) in the repo secrets}"
            # https://<ref>.supabase.co -> <ref>
            ref="${SUPABASE_URL#https://}"
            ref="${ref#http://}"
            ref="${ref%%.supabase.co*}"
            ref="${ref%%/*}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Deploying to project ref: $ref"
      - name: Link project and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BASELINE: ${{ github.event.inputs.baseline || 'auto' }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

          echo "::group::Pending migrations (dry run)"
          supabase db push --linked --dry-run | tee /tmp/pending.txt || true
          echo "::endgroup::"

          # This project's first 19 migrations were originally applied by hand
          # through the dashboard SQL Editor, so they may be missing from
          # supabase_migrations.schema_migrations. Re-running them would fail on
          # objects that already exist. Baseline them as applied first, so only
          # new migrations (0020+) actually run.
          #
          # Local files are named NNNN_name.sql, so the dry-run lists versions
          # like `0001`, `0020`. Only versions <= 0019 are baselined; anything
          # newer is expected to be genuinely new and is left to `db push`.
          baseline_versions=""
          if [ "$BASELINE" = "always" ]; then
            baseline_versions="0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012 0013 0014 0015 0016 0017 0018 0019"
          elif [ "$BASELINE" = "auto" ]; then
            baseline_versions=$(grep -oE '\b0[0-1][0-9]{2}_|\b0[0-1][0-9]{2}\b' /tmp/pending.txt 2>/dev/null \
              | sed 's/_$//' | awk '$1 <= "0019"' | sort -u | tr '\n' ' ' || true)
          fi

          if [ -n "${baseline_versions// /}" ]; then
            echo "::notice::Baselining already-applied migrations: $baseline_versions"
            # shellcheck disable=SC2086
            supabase migration repair --linked --status applied $baseline_versions --yes
          else
            echo "No baseline needed (mode=$BASELINE)."
          fi

          echo "::group::Applying migrations"
          supabase db push --linked --yes
          echo "::endgroup::"

  functions:
    name: Deploy Edge Functions
    needs: [db]
    if: >-
      always() && (needs.db.result == 'success' || needs.db.result == 'skipped') &&
      (github.event_name == 'push' ||
       github.event.inputs.components == 'all' ||
       contains(github.event.inputs.components, 'functions'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          # Pinned: resolving `latest` hits the GitHub API and fails the job with
          # "rate limit exceeded". v3 installs the CLI from npm.
          version: 2.121.0
      - name: Resolve project ref
        id: project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -e
          ref="$SUPABASE_PROJECT_ID"
          if [ -z "$ref" ]; then
            : "${SUPABASE_URL:?Set SUPABASE_URL (or SUPABASE_PROJECT_ID) in the repo secrets}"
            ref="${SUPABASE_URL#https://}"
            ref="${ref#http://}"
            ref="${ref%%.supabase.co*}"
            ref="${ref%%/*}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Deploying to project ref: $ref"
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: |
          set -euo pipefail
          # Link so the CLI reads supabase/config.toml per-function settings
          # (notably verify_jwt for payment-webhook). The DB password is
          # optional for functions, but passing it keeps link non-interactive.
          supabase link --project-ref "$PROJECT_REF" -p "${SUPABASE_DB_PASSWORD:-}"
          supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Set Edge Function secrets (project-level)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
          # Values the functions read at runtime. SUPABASE_URL / ANON / SERVICE
          # ROLE are already repo secrets; the rest are optional and only set
          # when provided (email, push, webhook signing, CORS).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_PROVIDER_KEY: ${{ secrets.EMAIL_PROVIDER_KEY }}
          CHAPA_WEBHOOK_SECRET: ${{ secrets.CHAPA_WEBHOOK_SECRET }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          args=()
          add() { if [ -n "${2:-}" ]; then args+=("$1=$2"); fi; }
          add SUPABASE_URL "$SUPABASE_URL"
          add SUPABASE_PUBLISHABLE_KEY "$SUPABASE_ANON_KEY"
          add SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          add EMAIL_PROVIDER_KEY "$EMAIL_PROVIDER_KEY"
          add CHAPA_WEBHOOK_SECRET "$CHAPA_WEBHOOK_SECRET"
          add EXPO_ACCESS_TOKEN "$EXPO_ACCESS_TOKEN"
          add ALLOWED_ORIGINS "$ALLOWED_ORIGINS"

          if [ "${#args[@]}" -eq 0 ]; then
            echo "::warning::No function secrets provided; functions deployed without runtime secrets."
            exit 0
          fi
          echo "Setting ${#args[@]} function secret(s)..."
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"

  mobile:
    name: Build mobile (EAS, Android)
    # Opt-in only: this needs EXPO_TOKEN and publishes the Expo app. It never
    # runs for the default "db,functions" backend deploy, so the missing Expo
    # secret cannot fail a backend release.
    if: >-
      github.event.inputs.components == 'all' ||
      contains(github.event.inputs.components, 'mobile')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set. Add it to the repo secrets, or deploy the backend only (components = db,functions)."
            exit 1
          fi
      - run: npm install --global eas-cli
      # When the Android upload keystore is provided as secrets, write it and a
      # credentials.json locally and build with the `ci` profile
      # (credentialsSource: local). Otherwise build with EAS-managed credentials.
      - name: Prepare Android credentials
        id: creds
        working-directory: apps/mobile
        env:
          # Accept every naming so the build works whichever set was stored
          # (`KEYSTORE_BASE` is the shorthand some setups use for the base64 blob).
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_BASE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            node scripts/write-android-credentials.mjs
            echo "profile=ci" >> "$GITHUB_OUTPUT"
          else
            echo "EAS-managed credentials will be used."
            echo "profile=production" >> "$GITHUB_OUTPUT"
          fi
      # The cloud build cannot see this runner's environment. Push the client's
      # Supabase config into the EAS project's `production` environment, which
      # the build profile loads (see the `environment` field in eas.json).
      - name: Sync EAS environment variables
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: |
          set -e
          : "${SUPABASE_URL:?SUPABASE_URL secret is required}"
          : "${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY secret is required}"
          eas env:set --name EXPO_PUBLIC_SUPABASE_URL \
            --value "$SUPABASE_URL" --environment production --visibility plaintext
          eas env:set --name EXPO_PUBLIC_SUPABASE_ANON_KEY \
            --value "$SUPABASE_ANON_KEY" --environment production --visibility plaintext
          eas env:set --name EXPO_PUBLIC_APP_ENV \
            --value "production" --environment production --visibility plaintext
          if [ -n "$SENTRY_DSN" ]; then
            eas env:set --name EXPO_PUBLIC_SENTRY_DSN \
              --value "$SENTRY_DSN" --environment production --visibility plaintext
          fi
      - name: Build Android (EAS)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile "${{ steps.creds.outputs.profile }}" --no-wait --non-interactive

  release:
    name: GitHub release
    # Tag pushes only. `always()` lets this run when the opt-in `mobile` job was
    # skipped, which is the normal case for a backend-only tag.
    if: >-
      always() && github.event_name == 'push' &&
      needs.db.result != 'failure' && needs.functions.result != 'failure'
    needs: [db, functions, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
