name: Deploy Supabase

# One-button backend deploy: database migrations + Edge Functions.
#
# Trigger it from the Actions tab: Actions -> "Deploy Supabase" -> Run workflow.
# It needs only the secrets that are already configured:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_URL
# The project ref is derived from SUPABASE_URL, so no SUPABASE_PROJECT_ID
# secret is required (if one is added later, it wins).
#
# Why the baseline step exists: this project's first migrations were applied
# by hand through the dashboard SQL Editor, so they are missing from
# supabase_migrations.schema_migrations. A plain `db push` would try to re-run
# them and fail on objects that already exist. "auto" marks those older
# migrations as applied first, so only genuinely new ones run (e.g. 0020).

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options:
          - database and functions
          - database only
          - functions only
        default: database and functions
      baseline:
        description: Migration history baseline for the first deploy
        type: choice
        options:
          - auto
          - never
          - always
        default: auto

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  db:
    name: Deploy database
    if: >-
      inputs.target == 'database and functions' ||
      inputs.target == 'database only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          # Pinned: resolving `latest` hits the GitHub API and fails the job
          # with "rate limit exceeded".
          version: 2.121.0
      - name: Resolve project ref
        id: project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -e
          ref="$SUPABASE_PROJECT_ID"
          if [ -z "$ref" ]; then
            : "${SUPABASE_URL:?Set SUPABASE_URL (or SUPABASE_PROJECT_ID) in the repo secrets}"
            ref="${SUPABASE_URL#https://}"
            ref="${ref#http://}"
            ref="${ref%%.supabase.co*}"
            ref="${ref%%/*}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Deploying to project ref: $ref"
      - name: Link project and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BASELINE: ${{ inputs.baseline }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

          echo "::group::Pending migrations (dry run)"
          supabase db push --linked --dry-run | tee /tmp/pending.txt || true
          echo "::endgroup::"

          # Local files are named NNNN_name.sql, so pending output lists
          # versions like `0001`, `0020`. Only 0001-0019 are baselined; newer
          # ones are genuinely new and left to `db push`.
          baseline_versions=""
          if [ "$BASELINE" = "always" ]; then
            baseline_versions="0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012 0013 0014 0015 0016 0017 0018 0019"
          elif [ "$BASELINE" = "auto" ]; then
            baseline_versions=$(grep -oE '\b0[0-1][0-9]{2}_|\b0[0-1][0-9]{2}\b' /tmp/pending.txt 2>/dev/null \
              | sed 's/_$//' | awk '$1 <= "0019"' | sort -u | tr '\n' ' ' || true)
          fi

          if [ -n "${baseline_versions// /}" ]; then
            echo "::notice::Baselining already-applied migrations: $baseline_versions"
            # shellcheck disable=SC2086
            supabase migration repair --linked --status applied $baseline_versions --yes
          else
            echo "No baseline needed (mode=$BASELINE)."
          fi

          echo "::group::Applying migrations"
          supabase db push --linked --yes
          echo "::endgroup::"

  functions:
    name: Deploy Edge Functions
    needs: [db]
    if: >-
      always() && (needs.db.result == 'success' || needs.db.result == 'skipped') &&
      (inputs.target == 'database and functions' || inputs.target == 'functions only')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Resolve project ref
        id: project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -e
          ref="$SUPABASE_PROJECT_ID"
          if [ -z "$ref" ]; then
            : "${SUPABASE_URL:?Set SUPABASE_URL (or SUPABASE_PROJECT_ID) in the repo secrets}"
            ref="${SUPABASE_URL#https://}"
            ref="${ref#http://}"
            ref="${ref%%.supabase.co*}"
            ref="${ref%%/*}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Deploying to project ref: $ref"
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: |
          set -euo pipefail
          # Link so the CLI reads the per-function settings in config.toml
          # (notably verify_jwt for payment-webhook).
          supabase link --project-ref "$PROJECT_REF" -p "${SUPABASE_DB_PASSWORD:-}"
          supabase functions deploy --project-ref "$PROJECT_REF"
      - name: Set Edge Function secrets (project-level)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
          # Runtime values the functions read. Optional ones are only pushed
          # when the matching repo secret exists.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_PROVIDER_KEY: ${{ secrets.EMAIL_PROVIDER_KEY }}
          CHAPA_WEBHOOK_SECRET: ${{ secrets.CHAPA_WEBHOOK_SECRET }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          args=()
          add() { if [ -n "${2:-}" ]; then args+=("$1=$2"); fi; }
          add SUPABASE_URL "$SUPABASE_URL"
          add SUPABASE_PUBLISHABLE_KEY "$SUPABASE_ANON_KEY"
          add SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          add EMAIL_PROVIDER_KEY "$EMAIL_PROVIDER_KEY"
          add CHAPA_WEBHOOK_SECRET "$CHAPA_WEBHOOK_SECRET"
          add EXPO_ACCESS_TOKEN "$EXPO_ACCESS_TOKEN"
          add ALLOWED_ORIGINS "$ALLOWED_ORIGINS"

          if [ "${#args[@]}" -eq 0 ]; then
            echo "::warning::No function secrets provided; functions deployed without runtime secrets."
            exit 0
          fi
          echo "Setting ${#args[@]} function secret(s)..."
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"
