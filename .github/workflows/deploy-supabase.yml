name: Deploy Supabase

# One-button backend deploy: database migrations + Edge Functions.
#
# Trigger it from the Actions tab: Actions -> "Deploy Supabase" -> Run workflow.
# It needs only the secrets that are already configured:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_URL
# The project ref is derived from SUPABASE_URL, so no SUPABASE_PROJECT_ID
# secret is required (if one is added later, it wins).
#
# Why the baseline step exists: this project's first migrations were applied
# by hand through the dashboard SQL Editor, so they are missing from
# supabase_migrations.schema_migrations. A plain `db push` would try to re-run
# them and fail on objects that already exist. "auto" marks those older
# migrations as applied first, so only genuinely new ones run (e.g. 0020).

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options:
          - database and functions
          - database only
          - functions only
        default: database and functions
      baseline:
        description: Migration history baseline for the first deploy
        type: choice
        options:
          - auto
          - never
          - always
        default: auto

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  db:
    name: Deploy database
    if: >-
      inputs.target == 'database and functions' ||
      inputs.target == 'database only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          # Pinned: resolving `latest` hits the GitHub API and fails the job
          # with "rate limit exceeded".
          version: 2.121.0
      - name: Resolve project ref
        id: project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -e
          ref="$SUPABASE_PROJECT_ID"
          if [ -z "$ref" ]; then
            : "${SUPABASE_URL:?Set SUPABASE_URL (or SUPABASE_PROJECT_ID) in the repo secrets}"
            ref="${SUPABASE_URL#https://}"
            ref="${ref#http://}"
            ref="${ref%%.supabase.co*}"
            ref="${ref%%/*}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Deploying to project ref: $ref"
      - name: Link project and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BASELINE: ${{ inputs.baseline }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

          # Which versions exist locally (files are NNNN_name.sql).
          mapfile -t local_versions < <(ls supabase/migrations \
            | grep -oE '^[0-9]{4}' | sort -u)
          echo "Local migrations: ${local_versions[*]}"

          # Which versions the remote history table already records. This is
          # the authoritative source: `db push` skips anything listed here.
          remote_versions=""
          echo "::group::Remote migration history"
          if supabase migration list --linked 2>&1 | tee /tmp/history.txt; then
            remote_versions=$(awk -F'│' '
              NF >= 2 {
                r = $2
                gsub(/[[:space:]]/, "", r)
                if (r ~ /^[0-9]{4}$/) print r
              }' /tmp/history.txt | sort -u | tr '\n' ' ')
            echo "Remote history records: ${remote_versions:-<none>}"
          else
            echo "::warning::Could not read the remote migration history; treating it as empty."
          fi
          echo "::endgroup::"

          # Baseline only 0001-0019: those were applied by hand through the
          # dashboard SQL Editor before CD existed, so their objects already
          # exist and re-running them fails. 0020+ is genuinely new and must
          # actually run.
          baseline_versions=""
          case "$BASELINE" in
            always)
              for v in "${local_versions[@]}"; do
                [ "$v" \> "0019" ] && continue
                baseline_versions="$baseline_versions $v"
              done
              ;;
            auto)
              for v in "${local_versions[@]}"; do
                [ "$v" \> "0019" ] && continue
                case " $remote_versions " in
                  *" $v "*) ;;                       # already recorded remotely
                  *) baseline_versions="$baseline_versions $v" ;;
                esac
              done
              ;;
          esac

          if [ -n "${baseline_versions// /}" ]; then
            echo "::notice::Baselining already-applied migrations: $baseline_versions"
            # shellcheck disable=SC2086
            supabase --yes migration repair --linked --status applied $baseline_versions
          else
            echo "No baseline needed (mode=$BASELINE)."
          fi

          echo "::group::Applying migrations"
          supabase --yes db push --linked
          echo "::endgroup::"

  functions:
    name: Deploy Edge Functions
    needs: [db]
    if: >-
      always() && (needs.db.result == 'success' || needs.db.result == 'skipped') &&
      (inputs.target == 'database and functions' || inputs.target == 'functions only')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Resolve project ref
        id: project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -e
          ref="$SUPABASE_PROJECT_ID"
          if [ -z "$ref" ]; then
            : "${SUPABASE_URL:?Set SUPABASE_URL (or SUPABASE_PROJECT_ID) in the repo secrets}"
            ref="${SUPABASE_URL#https://}"
            ref="${ref#http://}"
            ref="${ref%%.supabase.co*}"
            ref="${ref%%/*}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Deploying to project ref: $ref"
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: |
          set -euo pipefail
          # Link so the CLI reads the per-function settings in config.toml
          # (notably verify_jwt for payment-webhook).
          supabase link --project-ref "$PROJECT_REF" -p "${SUPABASE_DB_PASSWORD:-}"
          supabase functions deploy --project-ref "$PROJECT_REF"
      - name: Set Edge Function secrets (project-level)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
          SUPABASE_URL_VAL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_VAL: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY_VAL: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_PROVIDER_KEY: ${{ secrets.EMAIL_PROVIDER_KEY }}
          CHAPA_WEBHOOK_SECRET: ${{ secrets.CHAPA_WEBHOOK_SECRET }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          secrets=()
          [ -n "${SUPABASE_URL_VAL:-}" ] && secrets+=("FAM_SUPABASE_URL=${SUPABASE_URL_VAL}")
          [ -n "${SUPABASE_ANON_KEY_VAL:-}" ] && secrets+=("FAM_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_ANON_KEY_VAL}")
          [ -n "${SUPABASE_SERVICE_ROLE_KEY_VAL:-}" ] && secrets+=("FAM_SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY_VAL}")
          [ -n "${EMAIL_PROVIDER_KEY:-}" ] && secrets+=("EMAIL_PROVIDER_KEY=${EMAIL_PROVIDER_KEY}")
          [ -n "${CHAPA_WEBHOOK_SECRET:-}" ] && secrets+=("CHAPA_WEBHOOK_SECRET=${CHAPA_WEBHOOK_SECRET}")
          [ -n "${EXPO_ACCESS_TOKEN:-}" ] && secrets+=("EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN}")
          [ -n "${ALLOWED_ORIGINS:-}" ] && secrets+=("ALLOWED_ORIGINS=${ALLOWED_ORIGINS}")

          if [ "${#secrets[@]}" -eq 0 ]; then
            echo "::warning::No function secrets provided; functions deployed without runtime secrets."
            exit 0
          fi
          echo "Setting ${#secrets[@]} function secret(s)..."
          supabase --experimental secrets set --project-ref "$PROJECT_REF" "${secrets[@]}"
