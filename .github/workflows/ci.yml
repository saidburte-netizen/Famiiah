name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time placeholders. The admin app only needs *some* value at build
  # time (Next.js inlines NEXT_PUBLIC_* into the bundle); real values are
  # injected at deploy time by the CD workflow.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  node:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db:
    name: Database migrate, lint, pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db lint
      - run: supabase test db
      - run: supabase db reset
      - name: Ensure no drift (migrations reproduce cleanly)
        run: supabase db diff --schema public | grep -q . && (echo "Schema drift detected"; exit 1) || echo "no drift"

  admin:
    name: Build admin
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fam/admin build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Informational only: these are transitive build-tooling advisories
    # (e.g. `braces` via eslint/tailwind, `node-forge` via the Expo CLI) that
    # currently ship no patched version. Reported but not blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json
      - run: pnpm audit --audit-level=high
