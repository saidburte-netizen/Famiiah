name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time placeholders. The admin app only needs *some* value at build
  # time (Next.js inlines NEXT_PUBLIC_* into the bundle); real values are
  # injected at deploy time by the CD workflow.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  node:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db:
    name: Database migrate, lint, pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Supabase pulls several images from Docker Hub, which rate-limits
      # unauthenticated pulls on shared runners. Retry with backoff.
      - name: Start Supabase (with retries)
        run: |
          for i in 1 2 3 4 5; do
            if supabase start; then exit 0; fi
            echo "supabase start failed (attempt $i); waiting before retry…"
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep $((i * 20))
          done
          echo "supabase start failed after retries"; exit 1
      - run: supabase db lint --level error
      - run: supabase test db
      - run: supabase db reset
      - name: Ensure no drift (migrations reproduce cleanly)
        run: supabase db diff --schema public | grep -q . && (echo "Schema drift detected"; exit 1) || echo "no drift"

  admin:
    name: Build admin
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fam/admin build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json
      # Informational only: the remaining advisories are transitive build
      # tooling (e.g. `braces` via eslint/tailwind, `node-forge` via the Expo
      # CLI) that currently ship no patched version. Failures are reported
      # (annotations) but must not block the pipeline.
      - run: pnpm audit --audit-level=high
        continue-on-error: true
