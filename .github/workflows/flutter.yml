name: Flutter

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Only real errors should fail the build; lint infos/warnings are reported
      # as annotations without blocking (the const/prefer lints are noisy).
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
