name: Flutter

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  # Play Store application id for the Flutter client.
  APPLICATION_ID: com.fami.myapp
  APP_NAME: Fam
  FLUTTER_CHANNEL: stable

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      # Only real errors should fail the build; lint infos/warnings are reported
      # as annotations without blocking (the const/prefer lints are noisy).
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: apps/mobile_flutter
    env:
      # Compiled into the app. `SUPABASE_*` is the repo-wide naming (see
      # docs/DEPLOYMENT.md); `FAM_SUPABASE_*` matches the client's --dart-define
      # keys. Stored values are read whether they live in Actions *secrets* or
      # *variables*, so either works.
      FAM_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.FAM_SUPABASE_URL || vars.SUPABASE_URL || vars.FAM_SUPABASE_URL }}
      FAM_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.FAM_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || vars.FAM_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Supabase config
        # Without these the release APK/AAB cannot reach the backend and shows
        # the "can't reach the server" screen, so fail here instead of uploading
        # a dead artifact. Fork PRs receive no secrets and fail here by design.
        run: |
          if [ -z "${FAM_SUPABASE_URL}" ] || [ -z "${FAM_SUPABASE_ANON_KEY}" ]; then
            echo "::error title=Missing Supabase config::Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings -> Secrets and variables -> Actions (repository secrets or variables; the FAM_SUPABASE_* names work too). This workflow is not scoped to an environment, so Environment secrets are not visible here. A release build without them cannot reach the backend."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile_flutter/pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      - name: Toolchain check
        continue-on-error: true
        run: flutter doctor -v
      # The Gradle project is generated on demand and pointed at the Play id, so
      # no binary wrapper jar lives in the repository.
      - name: Prepare Android project
        # The ANDROID_KEYSTORE_* secrets are optional: when present the release
        # APK/AAB are signed with the upload keystore, otherwise the build falls
        # back to Flutter's debug signing (fine for CI, rejected by Play).
      - name: Prepare Android project
        # The keystore secrets are optional: when present the release APK/AAB are
        # signed with the upload keystore, otherwise the build falls back to
        # Flutter's debug signing (fine for CI, rejected by Play). Accept the
        # ANDROID_* or the shorter KEYSTORE_* naming, as deploy.yml does, so an
        # existing set is picked up rather than silently ignored.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_BASE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: bash tool/setup_android.sh
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=FAM_SUPABASE_URL="$FAM_SUPABASE_URL" \
            --dart-define=FAM_SUPABASE_ANON_KEY="$FAM_SUPABASE_ANON_KEY" \
            --dart-define=FAM_APP_ENV=production
      - name: Build release App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=FAM_SUPABASE_URL="$FAM_SUPABASE_URL" \
            --dart-define=FAM_SUPABASE_ANON_KEY="$FAM_SUPABASE_ANON_KEY" \
            --dart-define=FAM_APP_ENV=production
      - name: Upload APK / AAB
        uses: actions/upload-artifact@v4
        with:
          name: fam-android-release
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile_flutter/build/app/outputs/bundle/release/app-release.aab
      # Handy for committing the platform project once (contains gradle-wrapper.jar).
      - name: Upload generated android/ project
        uses: actions/upload-artifact@v4
        with:
          name: fam-android-project
          retention-days: 7
          path: apps/mobile_flutter/android
