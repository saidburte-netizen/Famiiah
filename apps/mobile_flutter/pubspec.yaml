name: fam_mobile
description: Fam — rent control client (Flutter).
publish_to: "none"
version: 1.1.9+11

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  go_router: ^14.6.2
  intl: ^0.19.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.8.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Brand typography is bundled rather than fetched at runtime so the app looks
  # identical offline and in release builds. Mirrors the design's two families:
  # Manrope for UI text, Playfair Display for the wordmark/display headings.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700

  assets:
    - assets/branding/
