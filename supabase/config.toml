# Supabase local configuration for Fam.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "fam"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = ["supabase/migrations"]

[db.seed]
enabled = true
sql_paths = ["supabase/seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "fam://"
additional_redirect_urls = ["fam://", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"

[auth.sms]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.s3_protocol]
enabled = true

[realtime]
enabled = true

[analytics]
enabled = false

[functions.send-reminders]
# Cron-only, and every call carries the service-role JWT (see
# `invoke_edge_function`). Requiring a valid JWT stops anonymous callers from
# queueing/dispatching pushes.
verify_jwt = true

[functions.invite-member]
verify_jwt = true

[functions.generate-receipt]
verify_jwt = true

[functions.payment-webhook]
verify_jwt = false

[functions.admin-api]
verify_jwt = true
